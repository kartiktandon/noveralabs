<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Absolute path, so the config loads whether the page is opened as /admin or /admin/ -->
<link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
<title>Novera Labs · Content editor</title>
</head>
<body>
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
<script>
  // Sign-in runs through this site's own /api/auth (username and password), so it works on any domain or preview URL
  CMS.init({
    config: {
      backend: {
        name: 'github',
        repo: 'kartiktandon/noveralabs',
        branch: 'main',
        base_url: location.origin,
        auth_endpoint: 'api/auth',
      },
    },
  });
  // The sign-in uses the editor's own username and password, so don't mention GitHub on the button
  new MutationObserver(function () {
    var walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    while (walk.nextNode()) {
      if (walk.currentNode.nodeValue.trim() === 'Login with GitHub') walk.currentNode.nodeValue = 'Sign in';
    }
  }).observe(document.body, { childList: true, subtree: true });
</script>
</body>
</html>
